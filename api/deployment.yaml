
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-api
  namespace: default
spec:
  selector:
    matchLabels:
      app: mi-api

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: mi-api

    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - kube-worker1
                      - kube-worker2
                      - kube-worker3

        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: mi-api
                topologyKey: kubernetes.io/hostname


      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: mi-api
          image: ghcr.io/greciafuent/mi-api:9171e1f
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: API_MENSAJE
              valueFrom:
                secretKeyRef:
                  name: doppler-prueba
                  key: API_MENSAJE

            - name: POSTGRES_HOST
              value: postgres

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 8
            failureThreshold: 6

          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
