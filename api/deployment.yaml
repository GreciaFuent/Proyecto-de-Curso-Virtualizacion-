apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-api
  template:
    metadata:
      labels:
        app: mi-api
    spec:
      containers:
        - name: mi-api
          image: localhost/mi-api:1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: datos
              mountPath: /data
          resources:
            requests:
              memory: "80Mi"
              cpu: "50m"
            limits:
              memory: "180Mi"
              cpu: "300m"
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: mi-api-datos
