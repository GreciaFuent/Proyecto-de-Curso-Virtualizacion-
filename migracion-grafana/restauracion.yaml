
apiVersion: v1
kind: Pod
metadata:
  name: grafana-restauracion
  namespace: monitoring
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: kube-worker3
  containers:
    - name: restauracion
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 86400
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: datos
          mountPath: /datos
  volumes:
    - name: datos
      persistentVolumeClaim:
        claimName: grafana-datos-nuevo
