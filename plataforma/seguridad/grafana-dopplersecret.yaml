
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: grafana-doppler
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-prd
  project: proyecto-virtualizacion
  config: prd
  secrets:
    - GRAFANA_ADMIN_PASSWORD
  managedSecret:
    name: grafana-admin-doppler
    namespace: monitoring
  processors:
    GRAFANA_ADMIN_PASSWORD:
      type: plain
      asName: admin-password
