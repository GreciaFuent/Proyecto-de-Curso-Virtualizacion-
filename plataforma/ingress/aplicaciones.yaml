apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mi-api
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`api.grupo4.lab`)
      kind: Rule
      services:
        - name: mi-api
          port: 8000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mi-web
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`app.grupo4.lab`)
      kind: Rule
      services:
        - name: mi-web
          port: 80
