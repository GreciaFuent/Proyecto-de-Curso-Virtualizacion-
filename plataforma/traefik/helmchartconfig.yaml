apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        loadBalancerIP: 192.168.1.160
    ports:
      postgres:
        port: 5432
        protocol: TCP
        expose:
          default: true
        exposedPort: 5432
