apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      nodeSelector:
        kubernetes.io/hostname: kube-worker2
      containers:
        - name: loki
          image: grafana/loki:3.6.3
          args:
            - "-config.file=/etc/loki/loki.yaml"
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          resources:
            requests:
              memory: 100Mi
              cpu: 50m
            limits:
              memory: 200Mi
              cpu: 300m
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: datos
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: datos
          persistentVolumeClaim:
            claimName: loki-datos
