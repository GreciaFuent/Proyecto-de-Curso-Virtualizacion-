apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: node-exporter
        static_configs:
          - targets:
              - "192.168.1.151:9100"
              - "192.168.1.152:9100"
              - "192.168.1.153:9100"
              - "192.168.1.154:9100"
      - job_name: mi-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - "mi-api.default.svc.cluster.local:8000"
      - job_name: kube-state-metrics
        metrics_path: /metrics
        static_configs:
          - targets:
              - "kube-state-metrics.monitoring.svc.cluster.local:8080"
