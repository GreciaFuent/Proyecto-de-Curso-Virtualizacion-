
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-restauracion
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GreciaFuent/Proyecto-de-Curso-Virtualizacion-.git
    targetRevision: main
    path: migracion-grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: true
