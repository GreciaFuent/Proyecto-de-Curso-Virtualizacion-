
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mi-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GreciaFuent/Proyecto-de-Curso-Virtualizacion-.git
    targetRevision: main
    path: web
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
