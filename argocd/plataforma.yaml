
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plataforma
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GreciaFuent/Proyecto-de-Curso-Virtualizacion-.git
    targetRevision: main
    path: plataforma
    directory:
      recurse: true
      exclude: 'metallb/*'
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
