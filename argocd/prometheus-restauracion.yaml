
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-restauracion
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/GreciaFuent/Proyecto-de-Curso-Virtualizacion-.git
    targetRevision: main
    path: migracion-prometheus

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      enabled: false
      prune: true
      selfHeal: true
