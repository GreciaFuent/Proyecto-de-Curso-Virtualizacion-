apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-web
  template:
    metadata:
      labels:
        app: mi-web
    spec:
      containers:
        - name: mi-web
          image: localhost/mi-web:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "96Mi"
              cpu: "200m"
