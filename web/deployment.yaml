apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-web
  namespace: default
spec:
  selector:
    matchLabels:
      app: mi-web
  template:
    metadata:
      labels:
        app: mi-web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: mi-web
          image: ghcr.io/greciafuent/mi-web:b27f7e0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "96Mi"
              cpu: "200m"
